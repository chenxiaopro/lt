# 对照示例，不要整份覆盖宝塔已有配置。
# 详细改法见安装包根目录 INSTALL-BAOTA.md 第 9 步。
# 把 qinghu.example.com、root 路径换成你的域名和目录。
# SSL 证书那两行以宝塔面板自动生成的为准，不要删。

server {
    listen 80;
    listen [::]:80;
    server_name qinghu.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qinghu.example.com;

    # 宝塔申请证书后会自动写入下面两行，保留面板生成的即可
    # ssl_certificate /www/server/panel/vhost/cert/qinghu.example.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/qinghu.example.com/privkey.pem;

    root /www/wwwroot/qinghu.example.com/frontend/dist;
    index index.html;
    client_max_body_size 16m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/ {
        alias /www/wwwroot/qinghu.example.com/backend/uploads/;
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/qinghu.example.com.log;
    error_log /www/wwwlogs/qinghu.example.com.error.log;
}
